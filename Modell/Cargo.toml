[package]
name = "nerva-vm"
version = "0.1.0"
edition = "2024"
default-run = "nerva-vm"
description = "Visual NERVA model: perception, local learning and QEMU keyboard actions"

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
nerva = { path = "../../NERVA", features = ["development"] }
nerva-qemu = { path = "../nerva-qemu" }
serde_json = "1"
